name: Secret scanning

# Same de-duplication as ci.yml, and for the same reason: the release PR's head branch is dev,
# so listing dev under `push` ran this workflow twice on every commit. See ci.yml for the full
# note. A push to dev with no open PR now runs nothing here either.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Phase 10c.2: pinned to the commit each tag currently resolves to, not the mutable tag
      # itself - see ci.yml's matching comment for why. Dependabot's github-actions ecosystem
      # entry bumps the SHA (and this comment) the same way it bumps a semver dependency.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # gitleaks diffs commit ranges to scan only what a PR/push actually introduces;
          # a shallow clone would leave it nothing to diff against.
          fetch-depth: 0

      # Free for this repo: gitleaks-action only requires a GITLEAKS_LICENSE secret for
      # private repos owned by a GitHub Organization, and this one is a personal-account repo.
      # If it ever moves under an org, add that secret or this job starts failing closed.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
