app = "kirichess-ui"
primary_region = "ams"

# 10a.3 read this file and deliberately left kill_timeout unset: Fly's 5 second default is right
# here. Nothing in this app has to reach a database before the process exits - that is the backend's
# LiveGamePersister, and only fly.backend*.toml buys time for it.

[build]
  dockerfile = "Dockerfile.frontend"
  # Next inlines NEXT_PUBLIC_* at build time, so the API origin has to be baked in here.
  # NEXT_PUBLIC_SENTRY_DSN must be passed the same way (as a build arg, e.g.
  # `--build-arg NEXT_PUBLIC_SENTRY_DSN=...` / a fly.toml build.args entry), a secret set after
  # build is invisible to already-inlined client code.
  [build.args]
    NEXT_PUBLIC_API_BASE = "https://api.kirichess.com"
    # Canonical origin for robots.txt/sitemap.xml/openGraph absolute URLs (Phase 9d.6). Update this
    # if a custom domain is ever fronted in place of the raw fly.dev hostname.
    NEXT_PUBLIC_SITE_URL = "https://kirichess.com"
    # Client-side DSN, safe to commit: NEXT_PUBLIC_* is inlined into the shipped JS bundle anyway,
    # so this is no more secret than it would be sitting in browser devtools after any pageview.
    NEXT_PUBLIC_SENTRY_DSN = "https://12d34da9cf712994888d8c33b19f54fc@o4511898652114944.ingest.de.sentry.io/4511898819756112"
    # DH.3. The site key is public by design. The widget's secret key is Turnstile__SecretKey on
    # kirichess-api, not a frontend build arg. The old siteverify Worker is unused (I-7-6).
    NEXT_PUBLIC_TURNSTILE_SITE_KEY = "0x4AAAAAAEOiGAzrqqug-0n7"
    # DH.5. Bake Google sign-in button into the client bundle. API OAuth secrets are separate.
    NEXT_PUBLIC_GOOGLE_SIGN_IN = "true"

# The server-side/edge DSN is a runtime value instead, set with:
#   fly secrets set --app kirichess-ui SENTRY_DSN=...
# (may be the same or a different Sentry project than the client DSN above).

[http_service]
  internal_port = 3000
  force_https = true
  # The frontend is stateless, so it is fine to scale to zero when idle.
  #
  # I-2-12: in practice this never happens in production. infra/betterstack/main.tf's edge_site
  # monitor polls https://kirichess.com every 180s from two regions, which restarts the machine
  # before it can idle out - min_machines_running = 0 is the fallback for a monitor outage, not the
  # steady-state. See DEPLOYMENT.md § 1.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
